<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itens em pixel art · Bodega do Sadi</title>
<style>body{margin:0;padding:30px;background:#213126;color:#fff1ce;font:16px system-ui}h1{font-size:26px;margin:0 0 8px}p{color:#c2c6ad}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}article{background:#f4e6bf;color:#382619;border:2px solid #b28a51;border-radius:10px;padding:14px;text-align:center}figure{height:135px;margin:0;display:grid;place-items:center;background:#e7d8b5;border-radius:5px}.large{width:128px;height:128px;object-fit:contain}img{image-rendering:pixelated}h2{font-size:14px;margin:12px 0}.sizes{display:flex;gap:18px;align-items:center;justify-content:center;height:52px}.sizes img{object-fit:contain}small{font-size:11px}</style>
<h1>Itens em pixel art · Bodega do Sadi</h1><p>PNG transparente · arte original e leitura em 24, 32 e 48 pixels.</p><main></main>
<script>const keys=["erva","pao_xis","burger","burger_pronto","ovo","ovo_pronto","queijo","salada","bacon","coracao","refri","cerveja","cachaca","cigarro","cigarro_py","codorna","pepino","salame","amendoim","pinhao","bergamota","cafe","bitter","torrada","xis_montado","xis_prensado","mate","wait"];
const names={erva:'Pacote de erva-mate',pao_xis:'Pão de xis',burger:'Hambúrguer cru',burger_pronto:'Hambúrguer grelhado',ovo:'Ovo cru',ovo_pronto:'Ovo frito',queijo:'Queijo',salada:'Salada',bacon:'Bacon',coracao:'Coração',refri:'Refrigerante',cerveja:'Cerveja na caneca',cachaca:'Cachaça',cigarro:'Cigarro',cigarro_py:'Cigarro do Paraguai',codorna:'Ovos de codorna',pepino:'Pepino em conserva',salame:'Salame de colônia',amendoim:'Amendoim torrado',pinhao:'Pinhão',bergamota:'Bergamota',cafe:'Café',bitter:'Bitter',torrada:'Torrada de salame',xis_montado:'Xis montado',xis_prensado:'Xis prensado',mate:'Chimarrão',wait:'Espera'};
document.querySelector('main').innerHTML=keys.map(k=>'<article><figure><img class="large" src="'+k+'.png" alt="'+names[k]+'"></figure><h2>'+names[k]+'</h2><div class="sizes">'+[24,32,48].map(s=>'<img src="'+k+'.png" alt="" width="'+s+'" height="'+s+'">').join('')+'</div><small>'+k+'.png</small></article>').join('');</script></html>
